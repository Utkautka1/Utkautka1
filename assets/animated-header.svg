<svg viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- АНИМИРОВАННЫЙ НЕОНОВЫЙ ГРАДИЕНТ -->
    <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#4FACFE;#00FF87;#7F00FF;#00F2FE" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4FACFE">
        <animate attributeName="stop-color" values="#4FACFE;#00FF87;#7F00FF;#00F2FE;#4FACFE" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00FF87">
        <animate attributeName="stop-color" values="#00FF87;#7F00FF;#00F2FE;#4FACFE;#00FF87" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- СТИЛИ ДЛЯ ПЕРЕЛИВАЮЩЕГОСЯ И ПЕЧАТАЮЩЕГОСЯ ТЕКСТА -->
    <style>
      .gradient-title {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 32px;
        font-weight: 800;
        fill: url(#rainbowGradient);
        text-anchor: middle;
      }

      .typing-subtitle {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 17px;
        font-weight: 600;
        fill: #8B949E;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- ПЕРЕЛИВАЮЩИЙСЯ ЗАГОЛОВОК -->
  <text x="50%" y="45" class="gradient-title">⚡ Dmitry — Senior Full-Stack &amp; DevOps Engineer ⚡</text>

  <!-- ВТОРАЯ СТРОКА -->
  <text x="50%" y="90" class="typing-subtitle">🚀 Python • FastAPI • Node.js • NestJS • React • TypeScript • Kubernetes • Redis • AWS</text>
</svg>
